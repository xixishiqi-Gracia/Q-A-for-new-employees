<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>新员工答疑导航</title>
    <style>
:root {
  --bg: #eef8f2;
  --ink: #16211d;
  --muted: #66756f;
  --line: #c7d4cf;
  --green: #14533f;
  --green-soft: #dff3e9;
  --blue: #174f8f;
  --blue-soft: #e3f0ff;
  --amber: #b86e1a;
  --amber-soft: #fff0c9;
  --red: #b52f2f;
  --red-soft: #ffe4e4;
  --surface: #ffffff;
  --shadow: 0 14px 32px rgba(20, 83, 63, 0.11);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: var(--bg);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Verdana, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.phone-shell {
  width: min(100%, 430px);
  min-height: 100vh;
  margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) 14px 28px;
  background: var(--bg);
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: 0 -14px 12px;
  padding: max(10px, env(safe-area-inset-top)) 14px 12px;
  background: rgba(238, 248, 242, 0.96);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(199, 212, 207, 0.7);
}

.hero {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 70px;
  margin-bottom: 12px;
  padding: 0 16px;
  border-radius: 12px;
  color: #fff;
  background: var(--green);
}

.hero h1 {
  margin: 0;
  font-size: 20px;
  line-height: 1;
  letter-spacing: 1px;
  font-weight: 900;
}

.hero h1 span {
  min-width: 0;
  white-space: nowrap;
}

.search-panel {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 46px;
  margin-bottom: 10px;
  padding: 0 6px 0 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
}

.search-panel label {
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
}

.search-panel input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  color: var(--ink);
  background: transparent;
}

.search-submit {
  min-width: 56px;
  min-height: 34px;
  border: 0;
  border-radius: 999px;
  color: #fff;
  background: var(--green);
  font-size: 13px;
  font-weight: 900;
}

.category-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  overflow: visible;
  padding: 2px 0 10px;
}

.category-pill,
.quick-link,
.capsule {
  min-height: 34px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #f7fbf8;
  color: var(--ink);
  white-space: nowrap;
}

.category-pill {
  display: inline-flex;
  flex: 1 1 calc(33.333% - 8px);
  justify-content: center;
  gap: 6px;
  align-items: center;
  min-width: 0;
  padding: 0 8px;
  font-size: 13px;
  font-weight: 800;
}

.category-pill span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.category-pill strong {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 11px;
}

.category-pill.active {
  border-color: var(--green);
  background: var(--green);
  color: #fff;
}

.category-pill.active strong { color: #b7f2d5; }

.quick-zone {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.quick-zone > strong {
  color: var(--green);
  font-size: 12px;
}

#quickLinks {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  flex: 1;
}

#quickLinks::-webkit-scrollbar { display: none; }

.quick-link {
  padding: 0 12px;
  color: var(--blue);
  background: var(--blue-soft);
  border-color: transparent;
  font-size: 12px;
  font-weight: 700;
}

.result-count {
  display: inline-flex;
  align-items: center;
  height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  background: var(--blue-soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.link-grid {
  display: grid;
  gap: 10px;
}

.answer-card {
  display: grid;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.card-topline,
.button-row,
.thumb-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.tag {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 0 11px;
  border-radius: 999px;
  color: var(--blue);
  background: var(--blue-soft);
  font-size: 11px;
  font-weight: 800;
}

.tag.strong {
  color: var(--green);
  background: var(--green-soft);
}

.tag.quiet {
  color: var(--muted);
  background: #f0f3f1;
}

.answer-card h3 {
  margin: 0;
  font-size: 18px;
  line-height: 1.35;
  letter-spacing: 0;
}

.preview-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: start;
  padding: 9px 10px;
  border-radius: 8px;
  background: #f6faf7;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}

.preview-row strong {
  color: var(--green);
  font-size: 12px;
  white-space: nowrap;
}

.detail-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  align-items: start;
}

.detail-actions details {
  min-width: fit-content;
}

.detail-actions .image-details[open] {
  width: 100%;
}

details {
  color: var(--muted);
  font-size: 12px;
}

summary {
  width: fit-content;
  color: var(--green);
  font-weight: 800;
}

.image-details summary {
  color: var(--blue);
}

.full-answer {
  margin-top: 8px;
  padding: 10px;
  border-radius: 8px;
  background: #f1f6f3;
  color: #1a1a1a;
  line-height: 1.7;
  font-size: 15px;
}



.updated {
  color: var(--muted);
  font-size: 11px;
}

.empty-state {
  margin-bottom: 12px;
  padding: 18px;
  border: 1px dashed var(--line);
  border-radius: 8px;
  color: var(--muted);
  background: var(--surface);
  text-align: center;
}


@media (min-width: 760px) {
  body {
    background: linear-gradient(90deg, #dbe8e2, #f4faf6);
  }

  .phone-shell {
    margin-top: 22px;
    margin-bottom: 22px;
    min-height: calc(100vh - 44px);
    border: 1px solid #0f1714;
    border-radius: 28px;
    box-shadow: 0 24px 70px rgba(22, 33, 29, 0.18);
  }
}

@media (max-width: 380px) {
  .category-pill {
    flex-basis: calc(50% - 8px);
  }
}

    </style>
  </head>
  <body>
    <main class="phone-shell">
      <header class="app-header">
        <section class="hero">
            <h1>新员工答疑导航</h1>
        </section>
        <form class="search-panel" id="searchForm" role="search">
          <label for="searchInput">Search</label>
          <input id="searchInput" type="search" placeholder="体检、饭卡、宿舍、考勤..." autocomplete="off" />
          <button class="search-submit" type="submit">确认</button>
        </form>
        <nav id="categoryNav" class="category-nav" aria-label="问题分类"></nav>
        <section class="quick-zone" aria-label="高频问题">
          <strong>高频</strong>
          <div id="quickLinks"></div>
          <span class="result-count" id="resultCount"></span>
        </section>
        <div class="result-bar">
          <span id="resultCount"></span>
        </div>
      </header>
      <section id="emptyState" class="empty-state" hidden>没有找到匹配内容，可以换个关键词。</section>
      <section id="linkGrid" class="link-grid" aria-label="问题列表"></section>
    </main>

    <script>
const qaItems = [
  {

    "question": "入职需要准备哪些资料？",

  {
    "id": "qa-02",
    "category": "入职",
    "group": "入职前准备",
    "number": 2,
    "question": "入职当天需要带什么？",
    "answer": "生活用品、床上用品(可生活超市购买)、身份证(原件)、毕业证(照片即可)",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-03",
    "category": "入职",
    "group": "入职前准备",
    "number": 3,
    "question": "入职当天在哪里集合？",
    "answer": "地图搜索:小漠比亚迪招聘中心,按照导航前往",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-04",
    "category": "入职",
    "group": "入职前准备",
    "number": 4,
    "question": "入职流程是什么？",
    "answer": "\*第一步：线上报名\n1. 电话面试（线上）\n    招聘人员通过电话沟通，确认岗位需求及录用情况。\n2. 微信公众号投递简历（线上）\n    根据招聘指引，通过微信公众号提交个人简历。\n3. AI面试（线上）\n    收到AI面试短信邀请后，按照提示完成线上面试。\n4. 面试结果通知（线上）\n    通过面试后，收到入职办理通知短信，按照通知时间前往招聘中心办理入职。\n\n\*第二步：现场办理入职\n1. 体检（线下）\n    地点：小漠比亚迪招聘中心\n    时间：每天(包含周末,有值班人员) 8:00-15:00\n2. 新员工培训（线下）\n    在招聘中心参加入职培训，了解公司基本信息、规章制度及安全要求。\n3. 签订劳动合同（线下）\n    根据短信通知完成劳动合同签订。\n4. 打印员工工卡（线下）\n    在招聘中心办理员工工卡。\n\n\*第三步：办理入住及生活准备\n1. 办理入住（线下）\n    地点：6#生活服务中心\n    办理内容：宿舍入住登记、饭卡激活、热水功能激活。\n2.生活超市购买生活用品(线下)\n\n\*第四步：后续培训安排\n入职手续完成后，通过微信通知后续新员工培训及上岗安排。\n1、事业部培训\n2、工厂培训\n3、班组培训",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-05",
    "category": "入职",
    "group": "入职前准备",
    "number": 5,
    "question": "入职办理需要多长时间？",
    "answer": "正常情况下，新员工入职流程预计 1-3天内完成。\n如遇特殊情况，办理时间可能会有所延长，例如：\n1. 简历信息填写错误或资料需要修改，需要重新确认信息；\n2. 体检结果异常，需要安排复检，等待复检结果。\n建议按照招聘通知时间及时办理相关手续，并提前准备好所需资料，以便顺利完成入职。",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-06",
    "category": "入职",
    "group": "入职前准备",
    "number": 6,
    "question": "体检在哪里进行？",
    "answer": "新员工入职体检可选择以下两种方式：\n1. 在所在地公立二级甲等及以上医院进行体检\n    认可机构：公立二甲及以上医院出具的入职体检报告。\n2. 前往小漠比亚迪招聘中心进行体检\n    体检费用：约50元。\n两种方式均可，员工可根据自身情况选择。\n\n温馨提示：\n* 公立医院体检费用预计约200-400元，具体以医院收费标准为准；\n* 如体检结果不符合入职要求，将无法办理入职，往返交通费用请提前考虑。",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-07",
    "category": "入职",
    "group": "入职前准备",
    "number": 7,
    "question": "体检标准是什么?",
    "answer": "1. 血压: 收缩压＜140mmHg；舒张压≤90mmHg。\n2. 心率: 心率＞50次/分钟，＜100次/分钟。\n3. BMI: BMI≤30。\n4. 肝功能: 谷丙转氨酶（ALT）≤95。\n5. 常规检查: 内科、眼科、口腔科、耳鼻喉科等检查结果无明显异常。\n6. 胸片检查: 胸片正位DR检查结果无明显异常。\n7. 血常规参考范围\n（1）白细胞（WBC）3.5～12×10⁹/L。\n（2）血红蛋白（Hb）≥90g/L。\n（3）血小板（PLT）80×10⁹/L＜PLT≤500×10⁹/L。",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-08",
    "category": "入职",
    "group": "入职前准备",
    "number": 8,
    "question": "体检不合格怎么办？",
    "answer": "如体检结果存在不符合入职体检要求的情况，可根据通知安排进行复检。\n复检后：\n* 如复检结果符合入职要求，可继续办理后续入职流程；\n* 如复检结果仍不符合入职要求，将无法办理入职。\n温馨提示：\n* 如体检结果不符合入职要求，将无法办理入职，往返交通费用请提前考虑。",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-09",
    "category": "入职",
    "group": "入职前准备",
    "number": 9,
    "question": "入职简历填写错误怎么办？",
    "answer": "简历填写常见注意事项：\n1. 教育经历填写\n* 非特殊情况，学习形式选择“全日制”；\n* 学校名称、专业名称需填写完整，不可以使用简称；\n    例如：“北京一中”应填写为“北京市第一中学”；\n* 系统选择栏中的学校、专业信息，需要与毕业证信息完全一致；\n* 如搜索结果与毕业证信息存在差异（包括一个字不同），请选择“其他”，再手动填写正确信息。\n2. 工作经历填写\n* 无特殊要求时，工作经历可以不填写。\n3. 技工证书填写\n* 如持有相关技能证书，请在附件处上传证书照片。\n填写简历时请确保个人信息真实、准确，避免因信息错误影响入职办理。\n如发现入职简历填写错误，请及时联系招聘人员进行确认和修改，避免影响后续入职流程。",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-10",
    "category": "入职",
    "group": "入职前准备",
    "number": 10,
    "question": "身份证丢失可以办理入职吗？",

    "updatedAt": "2026-07-30"

  {

  {

    "answer": "员工工卡需前往小漠比亚迪招聘中心自行打印。\n打印位置：\n* 招聘中心1楼设有工卡打印设备；\n* 招聘中心2楼设有工卡打印设备。\n办理方式：\n到达招聘中心后，根据现场指引前往工卡打印设备，自行完成工卡打印。",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-13",
    "category": "入职",
    "group": "工卡/员工信息",
    "number": 3,
    "question": "工卡丢失/损坏怎么办？",
    "answer": "如员工工卡丢失或损坏，可按照以下方式处理：\n1. 前往招聘中心尝试重新打印\n    前往招聘中心工卡打印设备处，确认是否可以重新打印工卡。\n2. 申请补换厂牌\n    如无法重新打印，可通过企业微信申请补换厂牌：\n操作路径：\n企业微信 → 工作台 → 应用中心 → 员工自助 → 我想做 → 补换厂牌",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-14",

    "number": 4,
    "question": "工卡有什么用途？",
    "answer": "员工工卡主要用于以下场景：\n1. 食堂消费:  在食堂就餐时，可使用工卡进行刷卡消费。\n2. 热水使用:  宿舍热水使用时，通过工卡进行刷卡计费。\n3. 考勤打卡:  上下班通过工卡进行考勤打卡。\n4. 园区公交乘坐:  乘坐园区公交车时，可使用工卡刷卡乘车。\n请妥善保管员工工卡，如发生丢失或损坏，请及时办理补换。",
    "updatedAt": "2026-07-30"
  },
  {

    "updatedAt": "2026-07-30"
  },
  {

    "updatedAt": "2026-07-30"

  {

  {
    "id": "qa-18",
    "category": "入职",
    "group": "工衣/劳保用品",
    "number": 4,
    "question": "工衣丢失怎么办？",
    "answer": "如工衣丢失，请及时告知班组长，按照相关流程进行处理。",
    "updatedAt": "2026-07-30"
  },
  {
    "id": "qa-19",
    "category": "入职",
    "group": "工衣/劳保用品",
    "number": 5,
    "question": "劳保用品在哪里领取？",
    "answer": "新员工入职后，根据岗位需求由班组统一安排劳保用品领取。\n如未领取或有缺少情况，请联系班组长确认。",
    "updatedAt": "2026-07-30"

const state = {
  activeCategory: "全部",
  query: "",
};

const searchInput = document.querySelector("#searchInput");
const searchForm = document.querySelector("#searchForm");
const categoryNav = document.querySelector("#categoryNav");
const quickLinks = document.querySelector("#quickLinks");
const linkGrid = document.querySelector("#linkGrid");
const resultCount = document.querySelector("#resultCount");
const emptyState = document.querySelector("#emptyState");



function categories() {
  return ["全部", ...new Set(qaItems.map((item) => item.category))];
}

function filteredItems() {
  const query = state.query.trim().toLowerCase();
  return qaItems.filter((item) => {
    const matchesCategory = state.activeCategory === "全部" || item.category === state.activeCategory;
    const haystack = [item.category, item.group, item.question, item.answer, item.updatedAt].join(" ").toLowerCase();
    return matchesCategory && (!query || haystack.includes(query));
  });
}

function compactAnswer(answer) {
  const firstLine = answer.split("\n").find(Boolean) || "待补充标准回答";
  return firstLine.length > 72 ? `${firstLine.slice(0, 72)}...` : firstLine;
}

function renderCategories() {
  categoryNav.innerHTML = "";
  categories().forEach((category) => {
    const count = category === "全部" ? qaItems.length : qaItems.filter((item) => item.category === category).length;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "category-pill";
    button.classList.toggle("active", category === state.activeCategory);
    button.dataset.category = category;
    button.innerHTML = `<span>${category}</span><strong>${count}</strong>`;
    button.addEventListener("click", () => {
      state.activeCategory = category;
      render();
    });
    categoryNav.append(button);
  });
}

function renderQuickLinks() {
  const important = ["上班公交车如何乘坐？", "打卡异常怎么办？", "入职需要什么银行卡？","工卡丢失/损坏怎么办?"];
  quickLinks.innerHTML = "";
  important
    .map((question) => qaItems.find((item) => item.question === question))
    .filter(Boolean)
    .forEach((item) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "quick-link";
      button.textContent = item.question;
      button.addEventListener("click", () => {
        state.query = item.question;
        searchInput.value = item.question;
        state.activeCategory = "全部";
        render();
        document.querySelector(`[data-card="${item.id}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      quickLinks.append(button);
    });
}


function renderCards(items) {
  linkGrid.innerHTML = "";
  emptyState.hidden = items.length > 0;
  resultCount.textContent = `${items.length} 条结果`;

  items.forEach((item) => {
    const article = document.createElement("article");
    article.className = "answer-card";
    article.dataset.card = item.id;
    article.innerHTML = `
      <div class="card-topline">
        <span class="tag strong">${item.category}</span>
        <span class="tag">${item.group}</span>
        <span class="tag quiet">#${item.number}</span>
      </div>

      <h3>${item.question}</h3>

      <div class="preview-row">
        <strong>预览</strong>
        <span>${compactAnswer(item.answer)}</span>
      </div>

      <div class="detail-actions">
        <details>
          <summary>查看完整答案</summary>
          <div class="full-answer">
            ${item.answer
              .replace(/\n/g, "<br>")
              .replace(
                /(https?:\/\/[^\s<]+)/g,
                '<a href="$1" target="_blank">$1</a>'
              )}
          </div>
        </details>
      </div>

      <div class="updated">更新时间：${item.updatedAt}</div>
    `;
    linkGrid.append(article);
  });
}





searchInput.addEventListener("input", (event) => {
  if (event.target.value.trim() === "") {
    state.query = "";
    render();
  }
});

searchForm.addEventListener("submit", (event) => {
  event.preventDefault();
  state.query = searchInput.value;
  render();
});



function render() {
  renderCategories();
  renderQuickLinks();
  renderCards(filteredItems());
}

render();

    </script>
  </body>
